<div class="v-stack">
    <p>
        <label for="random-string__length">String Length</label>
        <input class="random-string__opt" type="number" id="random-string__length" value="20" min="1" max="100"/>
    </p>
    <p>
        <label for="random-string__specialchars">
            <input class="random-string__opt" type="checkbox" id="random-string__specialchars" />
            Include Special Characters
        </label>
    </p>
    <p>
        <label for="random-string__numbers">
            <input class="random-string__opt" type="checkbox" id="random-string__numbers"  />
            Include Numbers
        </label>
    </p>
</div>

<pre contenteditable id="random-string__result"></pre>
